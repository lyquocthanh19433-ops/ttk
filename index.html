<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6, #fff7fb);
      color: #7a2f55;
    }

    .heart {
      position: fixed;
      top: -20px;
      color: rgba(255, 82, 145, 0.55);
      animation: fall linear forwards;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 430px);
      padding: 34px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 141, 188, 0.45);
      border-radius: 32px;
      box-shadow: 0 22px 60px rgba(214, 77, 132, 0.22);
    }

        h1 {
      font-size: clamp(25px, 6vw, 34px);
      line-height: 1.22;
      margin-bottom: 14px;
      color: #b92d70;
    }

    .subtitle {
      min-height: 48px;
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: 600;
      color: #8f3b63;
    }

    .cute-img {
      width: 185px;
      height: 185px;
      object-fit: cover;
      border-radius: 28px;
      margin: 0 auto 24px;
      display: block;
      box-shadow: 0 12px 30px rgba(255, 105, 160, 0.25);
      border: 6px solid #fff;
    }

    .buttons {
      position: relative;
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-top: 4px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      border-radius: 999px;
      padding: 14px 22px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, left 0.25s ease, top 0.25s ease, opacity 0.25s ease;
      min-width: 130px;
      max-width: 48%;
      min-height: 54px;
    }

    #yesBtn {
      color: white;
      background: linear-gradient(135deg, #ff4f9a, #ff85b6);
      box-shadow: 0 10px 24px rgba(255, 79, 154, 0.35);
    }

    #yesBtn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 14px 30px rgba(255, 79, 154, 0.45);
    }

    #noBtn {
      position: relative;
      color: #d64282;
      background: #fff;
      border: 2px solid #ff9ac5;
      box-shadow: 0 8px 18px rgba(255, 131, 182, 0.22);
      left: auto;
      top: auto;
    }

    .message {
      display: none;
      animation: pop 0.5s ease forwards;
    }

    .message h2 {
      color: #d63384;
      font-size: 31px;
      margin-bottom: 12px;
    }

    .message p {
      font-size: 18px;
      line-height: 1.6;
      color: #7e345a;
    }

    @keyframes pop {
      from { transform: scale(0.78); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .sparkle {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      font-size: 70px;
      z-index: 3;
      pointer-events: none;
      animation: sparkle 1.2s ease forwards;
    }

    @keyframes sparkle {
      0% { transform: scale(0.2); opacity: 0; }
      35% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 18px;
      }

      .cute-img {
        width: 155px;
        height: 155px;
      }

      button {
        font-size: 16px;
        padding: 13px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="sparkle" id="sparkle">💖</div>

  <main class="card" id="card">
    <section id="questionBox">
      
      <h1>đừng có quạo nữa màaaa</h1>
      <p class="subtitle" id="subtitle">chọn một cái đi màaa 🥺</p>

      <!-- Bạn có thể thay link ảnh/GIF bên dưới bằng ảnh của bạn -->
      <img
        class="cute-img"
        id="cuteImg"
        src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
        alt="cute cat"
      />

      <div class="buttons" id="buttonArea">
        <button id="yesBtn">ilu &lt;3</button>
        <button id="noBtn">ai rảnh mà giận người dưng</button>
      </div>
    </section>

    <section class="message" id="messageBox">
      <h2>yayyyy 💗</h2>
      <p>
        người gì đâu mà dth thế,<br />
        nhớ canh đt nha, chị Yến mua gì cho áaaa 💗
      </p>
    </section>
  </main>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const subtitle = document.getElementById("subtitle");
    const questionBox = document.getElementById("questionBox");
    const messageBox = document.getElementById("messageBox");
    const buttonArea = document.getElementById("buttonArea");
    const sparkle = document.getElementById("sparkle");

    const noTexts = [
      "huhu",
      "huhuhu đừng có giận",
      "tội nghiệp tui quá",
      "thôi màaaaaa"
    ];

    let noCount = 0;
    let yesScale = 1;

    function moveNoButton() {
      if (noCount >= 5) return;

      subtitle.textContent = noTexts[noCount % noTexts.length];
      noCount++;

      if (noCount >= 5) {
        noBtn.style.opacity = "0";
        noBtn.style.transform = "scale(0.8)";
        setTimeout(() => {
          noBtn.style.display = "none";
        }, 250);
        subtitle.textContent = "hết đường giận rồi nhaaa 🥺";
        return;
      }

      const maxMove = 28;
      const randomX = (Math.random() * maxMove * 2) - maxMove;
      const randomY = (Math.random() * maxMove * 2) - maxMove;

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

      yesScale += 0.08;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      questionBox.style.display = "none";
      messageBox.style.display = "block";
      sparkle.style.display = "grid";
      createManyHearts();
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["💗", "💖", "💕", "💘", "🌷"][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 18 + 16 + "px";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5200);
    }

    function createManyHearts() {
      for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 70);
      }
    }

    setInterval(createHeart, 500);

    window.addEventListener("beforeunload", (event) => {
      event.preventDefault();
      event.returnValue = "đừng thoát màaaa 🥺";
    });
  </script>
</body>
</html>
